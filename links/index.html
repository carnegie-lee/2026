<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카네기 LEE 재단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1f6b56;
    --green-dark:#175243;
    --ink:#1d1d1f;
    --muted:#8a8a8e;
    --line:#ececec;
    --bg:#fafafa;
    --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Noto Sans KR',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;justify-content:center;
    padding:48px 20px 64px;
  }
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;}

  .logo-box{width:100%;display:flex;justify-content:center;margin-bottom:22px;}
  .logo-box img{width:100%;max-width:260px;height:auto;display:block;}

  /* ===== Carousel ===== */
  .carousel{width:100%;margin-bottom:14px;}
  .cap{
    font-size:12px;color:var(--muted);letter-spacing:.06em;
    text-align:center;margin-bottom:10px;font-weight:500;
  }
  .cap b{color:var(--green);font-weight:700;}
  .track-box{position:relative;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08);background:#000;}
  .track{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .track::-webkit-scrollbar{display:none;}
  .slide{flex:0 0 100%;scroll-snap-align:center;}
  .slide img{width:100%;height:auto;display:block;}

  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.88);box-shadow:0 2px 8px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;z-index:2;
    transition:background .15s ease;
  }
  .nav:hover{background:#fff;}
  .nav svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .nav.prev{left:10px;}
  .nav.next{right:10px;}

  .dots{display:flex;justify-content:center;gap:7px;margin:14px 0 34px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#d4d4d4;border:none;cursor:pointer;transition:all .2s ease;padding:0;}
  .dot.active{background:var(--green);width:20px;border-radius:4px;}

  .sub{
    font-size:13px;color:var(--muted);
    letter-spacing:.02em;margin-bottom:28px;text-align:center;font-weight:400;
  }

  .links{width:100%;display:flex;flex-direction:column;gap:13px;}
  .link{
    display:flex;align-items:center;gap:15px;width:100%;padding:17px 20px;
    border-radius:14px;background:var(--card);border:1px solid var(--line);
    color:var(--ink);text-decoration:none;
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .link:hover{border-color:#d8d8d8;box-shadow:0 6px 18px rgba(0,0,0,.06);transform:translateY(-2px);}
  .link:active{transform:translateY(0);}
  .ic{flex:0 0 40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f0f6f3;}
  .ic svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
  .txt .t{font-size:15px;font-weight:500;}
  .txt .d{font-size:12px;color:var(--muted);font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chev{flex:0 0 auto;color:#c4c4c4;}
  .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .featured{background:var(--green);border-color:var(--green);}
  .featured .t,.featured .d{color:#fff;}
  .featured .d{color:rgba(255,255,255,.78);}
  .featured .ic{background:rgba(255,255,255,.16);}
  .featured .ic svg{stroke:#fff;}
  .featured .chev{color:rgba(255,255,255,.7);}
  .featured:hover{background:var(--green-dark);border-color:var(--green-dark);box-shadow:0 8px 22px rgba(31,107,86,.25);}

  .foot{margin-top:40px;font-size:11px;letter-spacing:.18em;color:#c0c0c0;text-transform:uppercase;text-align:center;}
</style>
</head>

<script>
  var track=document.getElementById('track');
  var dots=Array.prototype.slice.call(document.querySelectorAll('.dot'));
  var n=track.children.length, cur=0;
  function go(i){
    cur=Math.max(0,Math.min(n-1,i));
    track.scrollTo({left:cur*track.clientWidth, behavior:'smooth'});
    update();
  }
  function update(){ dots.forEach(function(d,i){d.classList.toggle('active',i===cur);}); }
  document.getElementById('prev').onclick=function(){go(cur-1);};
  document.getElementById('next').onclick=function(){go(cur+1);};
  dots.forEach(function(d){d.onclick=function(){go(parseInt(d.dataset.i,10));};});
  track.addEventListener('scroll',function(){
    var i=Math.round(track.scrollLeft/track.clientWidth);
    if(i!==cur){cur=i;update();}
  });
</script>
