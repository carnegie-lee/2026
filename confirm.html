<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이메일 인증 완료 - Carnegie LEE Foundation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .confirm-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    .confirm-icon {
      width: 64px;
      height: 64px;
      background: #E8F5E9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      color: #2E7D32;
      font-weight: 700;
    }
    .confirm-title {
      font-size: 22px;
      font-weight: 700;
      color: #0C3D40;
      margin-bottom: 12px;
    }
    .confirm-desc {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .confirm-sub {
      font-size: 14px;
      color: #999;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="confirm-card">
    <div class="confirm-icon">&#10003;</div>
    <div class="confirm-title">인증되었습니다!</div>
    <div class="confirm-desc">이메일 인증이 완료되었습니다.<br>다시 로그인해 주세요.</div>
    <div class="confirm-sub">이 페이지는 닫으셔도 됩니다.<br>돌아가서 로그인해 주세요.</div>
  </div>
</body>
</html>
